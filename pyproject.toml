[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-engine"
version = "2.0.0"
requires-python = ">=3.9,<3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["content_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Only mock torch in tests that import the full content_engine module
# Individual model tests (test_quality, test_face_detection, test_content_understanding)
# should import directly without going through __init__.py
